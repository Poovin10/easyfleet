name: easyfleet_workspace
description: Flutter monorepo for EasyFleet Driver and EasyFleet Transporter.
publish_to: none

environment:
  sdk: ^3.14.0

# Dart-native pub workspaces. `flutter pub get` at the root resolves every member.
workspace:
  - apps/driver
  - apps/transporter
  - packages/core
  - packages/auth
  - packages/network
  - packages/domain
  - packages/ui
  - packages/sync
  - packages/maps
