  easyfleet_auth:
    path: ../../packages/auth
  easyfleet_network:
    path: ../../packages/network
  easyfleet_domain:
    path: ../../packages/domain
  easyfleet_ui:
    path: ../../packages/ui
  easyfleet_sync:
    path: ../../packages/sync
  easyfleet_maps:
    path: ../../packages/maps

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
