name: easyfleet_driver
description: EasyFleet Driver — Flutter migration of com.easyfleet.driver.
publish_to: none
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  supabase_flutter: ^2.18.3
  geolocator: ^14.1.2
  permission_handler: ^13.0.2
  flutter_local_notifications: ^23.0.3
